name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the library supports, and the newest.
        python: ["3.8", "3.13"]
    # ubuntu-24.04 has no Python 3.8.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build pytest
      - run: python -m pip install .
      - name: src/qubesync/operations/ matches tests/fixtures/operations.json
        run: python scripts/generate_operations.py --check
      - run: python -m pytest -q
      - name: mypy on a sample of the generated types
        if: matrix.python == '3.13'
        run: |
          python -m pip install mypy
          python -m mypy --strict --warn-unused-ignores tests/typecheck/sample.py
      - name: mypy on the generated workflow types (the golden file, and a served document's)
        if: matrix.python == '3.13'
        run: |
          python -c "import json, qubesync.workflow_types as w; print(w.render(json.load(open('tests/fixtures/workflow_types/served.json')), source='https://qubesync.com/api/v2/workflows/types').python, end='')" > served_workflows.py
          MYPYPATH=tests/fixtures/workflow_types python -m mypy --strict --warn-unused-ignores tests/typecheck/workflows.py served_workflows.py
      - run: python -m build
  kit:
    # The integration kit's adapters, on the oldest and newest framework each Python takes:
    # Django 3.2 and Flask 2 on Python 3.8, the newest Django and Flask 3 on 3.13, and the
    # newest FastAPI each Python installs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.8"
            django: "Django>=3.2,<4"
            flask: "Flask>=2,<3"
            werkzeug: "Werkzeug<3"
          - python: "3.13"
            django: "Django"
            flask: "Flask>=3"
            werkzeug: "Werkzeug"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build
      - run: >-
          python -m pip install -e ".[test]" "${{ matrix.django }}" "${{ matrix.flask }}"
          "${{ matrix.werkzeug }}" "SQLAlchemy>=1.4" fastapi "jinja2>=3" python-multipart
      - run: python -m pip list | grep -iE '^(django|flask|fastapi|starlette|sqlalchemy) '
      # The kit's tables on both ORMs, every route through all three adapters, and each
      # adapter's own.
      - run: >-
          python -m pytest -q tests/test_kit.py tests/test_kit_models.py tests/test_kit_routes.py
          tests/test_kit_django.py tests/test_kit_flask.py tests/test_kit_fastapi.py
      - name: The wheel ships the templates, the template tags and the Django migrations
        run: |
          python -m build -w
          for file in kit/templates/qubesync/question.html kit/templates/qubesync/run_status.html \
                      django/templates/qubesync/question.html django/templates/qubesync/run_status.html \
                      django/templatetags/qubesync.py django/migrations/0001_initial.py; do
            python -m zipfile -l dist/*.whl | grep -q "qubesync/$file" || { echo "missing $file"; exit 1; }
          done
