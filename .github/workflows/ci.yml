name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the library supports, and the newest.
        python: ["3.8", "3.13"]
    # ubuntu-24.04 has no Python 3.8.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build pytest
      - run: python -m pip install .
      - run: python -m pytest -q
      - run: python -m build
