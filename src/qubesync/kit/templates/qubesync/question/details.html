{#- What the question is about: label and value rows (question.details). -#}
{% autoescape true %}
<table class="{{ qube_classes('details', 'qube-question-details') }}">
  {% for row in question.details %}
  <tr><th scope="row">{{ row.label }}</th><td>{{ row.value }}</td></tr>
  {% endfor %}
</table>
{% endautoescape %}
