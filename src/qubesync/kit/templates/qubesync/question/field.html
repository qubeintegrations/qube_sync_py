{#- The wrapper every field piece renders its control (control, HTML) in, with the field's label. -#}
{% autoescape true %}
{% if field.labelled %}
<div class="{{ qube_classes('field', 'qube-field', 'qube-field-' ~ field.type) }}">
  {% if field.type == "boolean" %}
  {{ control }}
  <label for="{{ field.dom_id }}" class="{{ qube_classes('label', 'qube-label') }}">{{ field.label }}</label>
  {% else %}
  <label for="{{ field.dom_id }}" class="{{ qube_classes('label', 'qube-label') }}">{{ field.label }}</label>
  {{ control }}
  {% endif %}
</div>
{% else %}
{{ control }}
{% endif %}
{% endautoescape %}
