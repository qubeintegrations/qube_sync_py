{#- A checkbox: ticked posts "true", sent as true; unticked, false. -#}
{% autoescape true %}
{% set control %}<input type="checkbox" id="{{ field.dom_id }}" name="{{ field.input_name }}" value="true" class="{{ qube_classes('checkbox', 'qube-checkbox', 'qube-rows-input' if field.cell else none) }}"{% if field.disabled %} disabled{% endif %}{% if not field.labelled %} aria-label="{{ field.label }}"{% endif %}{% if field.cell %} data-qube-rows-input{% endif %}>{% endset %}
{% include "qubesync/question/field.html" %}
{% endautoescape %}
